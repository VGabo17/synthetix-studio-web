<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthetix Studio | Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glow-purple { box-shadow: 0 0 25px rgba(176, 38, 255, 0.25); }
    .text-glow { text-shadow: 0 0 12px rgba(176, 38, 255, 0.7); }
    .glass-card { background: rgba(13, 13, 18, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(147, 51, 234, 0.3); }
  </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-100 min-h-screen font-sans flex flex-col md:flex-row selection:bg-[#b026ff] selection:text-white">

  <!-- Mobile Top Bar -->
  <div class="md:hidden flex justify-between items-center p-4 bg-zinc-950 border-b border-purple-900/40">
    <div onclick="navigate('/')" class="flex items-center gap-2 cursor-pointer">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-700 to-[#b026ff] flex items-center justify-center font-black text-white">S</div>
      <span class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-[#b026ff]">SYNTHETIX</span>
    </div>
    <button onclick="toggleSidebar()" class="p-2 bg-zinc-900 rounded-lg text-purple-300 border border-purple-800/40">
      ☰
    </button>
  </div>

  <!-- Sidebar Navigation -->
  <aside id="sidebar" class="hidden md:flex flex-col w-full md:w-64 bg-zinc-950 border-r border-purple-900/40 p-4 space-y-6 shrink-0 min-h-screen">
    <div onclick="navigate('/')" class="cursor-pointer flex items-center gap-3 px-2 py-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-700 via-[#b026ff] to-indigo-500 flex items-center justify-center font-black text-white text-xl shadow-[0_0_15px_rgba(176,38,255,0.5)]">
        S
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-[#b026ff] to-indigo-300 text-glow">
          SYNTHETIX
        </h1>
        <p class="text-[10px] text-purple-400 font-mono">STUDIO CONTROL</p>
      </div>
    </div>

    <!-- Menú Principal -->
    <nav class="flex-1 space-y-1 text-xs font-medium">
      <div class="text-[10px] uppercase font-bold text-zinc-500 px-3 pt-2 pb-1">Navegación</div>
      <button onclick="navigate('/')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/50 hover:text-purple-300 transition text-left">
        🏠 Inicio Publico
      </button>

      <div id="userNav" class="space-y-1 pt-2">
        <div class="text-[10px] uppercase font-bold text-purple-400 px-3 pt-2 pb-1">Panel Cliente</div>
        <button onclick="navigate('/dashboard')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/60 hover:text-purple-300 transition text-left">
          📊 Visión General
        </button>
        <button onclick="navigate('/dashboard/vault')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/60 hover:text-purple-300 transition text-left">
          📦 Resource Vault (.jar)
        </button>
        <button onclick="navigate('/dashboard/tickets')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/60 hover:text-purple-300 transition text-left">
          🎫 Soporte & Tickets
        </button>
        <button onclick="navigate('/dashboard/terms')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/60 hover:text-purple-300 transition text-left">
          📜 Términos & Licencias
        </button>
        <button onclick="navigate('/dashboard/settings')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/60 hover:text-purple-300 transition text-left">
          ⚙️ Perfil y Ajustes
        </button>
      </div>

      <div id="adminNav" class="space-y-1 pt-4 hidden">
        <div class="text-[10px] uppercase font-bold text-[#b026ff] px-3 pt-2 pb-1">Administración</div>
        <button onclick="navigate('/admin')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/80 hover:text-purple-200 transition text-left border border-purple-900/30">
          🛡️ Métricas Admin
        </button>
        <button onclick="navigate('/admin/users')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/80 hover:text-purple-200 transition text-left border border-purple-900/30">
          👥 Gestor de Usuarios
        </button>
        <button onclick="navigate('/admin/tickets')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-purple-950/80 hover:text-purple-200 transition text-left border border-purple-900/30">
          📩 Consola de Tickets
        </button>
      </div>
    </nav>

    <div id="userFooter" class="pt-4 border-t border-purple-900/40 text-xs">
      <!-- Info de usuario e inicio de sesión -->
    </div>
  </aside>

  <!-- Main Content Area -->
  <main id="app" class="flex-1 p-4 sm:p-8 max-w-6xl w-full mx-auto overflow-y-auto min-h-screen">
    <!-- Renderizado dinámico según la subpágina -->
  </main>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = null;

    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('hidden');
    }

    function navigate(path) {
      window.history.pushState({}, '', path);
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('hidden');
      }
      render();
    }
    window.onpopstate = render;

    async function fetchUser() {
      if (!token) { currentUser = null; return; }
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
        } else {
          localStorage.removeItem('token');
          token = null;
          currentUser = null;
        }
      } catch { currentUser = null; }
    }

    function updateSidebar() {
      const adminNav = document.getElementById('adminNav');
      const userFooter = document.getElementById('userFooter');

      if (currentUser) {
        if (['founder', 'staff'].includes(currentUser.role)) {
          adminNav.classList.remove('hidden');
        } else {
          adminNav.classList.add('hidden');
        }

        userFooter.innerHTML = `
          <div class="flex items-center justify-between p-2.5 bg-zinc-900 rounded-xl border border-purple-900/40">
            <div>
              <p class="font-bold text-slate-200 text-xs">${currentUser.username}</p>
              <span class="text-[10px] font-mono text-purple-400 uppercase">${currentUser.role}</span>
            </div>
            <button onclick="logout()" class="px-2 py-1 bg-purple-950 text-purple-300 rounded hover:bg-purple-900 text-[10px]">Salir</button>
          </div>
        `;
      } else {
        adminNav.classList.add('hidden');
        userFooter.innerHTML = `
          <div class="space-y-2">
            <button onclick="navigate('/login')" class="w-full py-2 bg-purple-950 border border-purple-800 text-purple-300 rounded-xl font-medium text-xs">Iniciar Sesión</button>
            <button onclick="navigate('/register')" class="w-full py-2 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white rounded-xl font-bold text-xs shadow-[0_0_12px_rgba(176,38,255,0.4)]">Crear Cuenta</button>
          </div>
        `;
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      currentUser = null;
      navigate('/login');
    }

    async function render() {
      await fetchUser();
      updateSidebar();
      const path = window.location.pathname;
      const app = document.getElementById('app');

      // 1. INICIO PÚBLICO
      if (path === '/') {
        app.innerHTML = `
          <div class="space-y-8 py-6">
            <div class="glass-card p-8 rounded-2xl border border-purple-900/50 glow-purple text-center space-y-4">
              <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-[#b026ff] to-indigo-300 text-glow">
                SYNTHETIX STUDIO
              </h1>
              <p class="text-sm sm:text-base text-zinc-400 max-w-2xl mx-auto">
                Desarrollo de Plugins Custom de Minecraft, Configuración de Servidores, Bots de Discord y Arquitectura Edge en Cloudflare Workers.
              </p>
            </div>
          </div>
        `;
      }

      // 2. LOGIN
      else if (path === '/login') {
        app.innerHTML = `
          <div class="max-w-md mx-auto glass-card p-8 rounded-2xl space-y-4 border border-purple-900/60 glow-purple mt-8">
            <h2 class="text-2xl font-bold text-center text-purple-300">Acceso al Panel</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="text-xs text-purple-400">Usuario o Correo</label>
                <input type="text" id="user" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-xs focus:border-[#b026ff] outline-none">
              </div>
              <div>
                <label class="text-xs text-purple-400">Contraseña</label>
                <input type="password" id="pass" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-xs focus:border-[#b026ff] outline-none">
              </div>
              <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white font-bold text-xs rounded-xl shadow-[0_0_15px_rgba(176,38,255,0.4)]">Entrar</button>
            </form>
          </div>
        `;
      }

      // 3. REGISTRO
      else if (path === '/register') {
        app.innerHTML = `
          <div class="max-w-md mx-auto glass-card p-8 rounded-2xl space-y-4 border border-purple-900/60 glow-purple mt-8">
            <h2 class="text-2xl font-bold text-center text-purple-300">Crear Cuenta</h2>
            <form onsubmit="handleRegister(event)" class="space-y-4">
              <div>
                <label class="text-xs text-purple-400">Nombre de Usuario</label>
                <input type="text" id="regUser" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-xs focus:border-[#b026ff] outline-none">
              </div>
              <div>
                <label class="text-xs text-purple-400">Correo Electrónico</label>
                <input type="email" id="regEmail" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-xs focus:border-[#b026ff] outline-none">
              </div>
              <div>
                <label class="text-xs text-purple-400">Contraseña</label>
                <input type="password" id="regPass" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-xs focus:border-[#b026ff] outline-none">
              </div>
              <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white font-bold text-xs rounded-xl shadow-[0_0_15px_rgba(176,38,255,0.4)]">Registrarse</button>
            </form>
          </div>
        `;
      }

      // 4. DASHBOARD GENERAL (/dashboard)
      else if (path === '/dashboard') {
        if (!currentUser) return navigate('/login');
        app.innerHTML = `
          <div class="space-y-6">
            <div class="glass-card p-6 rounded-2xl border border-purple-900/40">
              <h2 class="text-2xl font-extrabold text-purple-300">Bienvenido, ${currentUser.username}</h2>
              <p class="text-xs text-zinc-400 mt-1">Estado del servicio: <span class="text-emerald-400 font-bold">Activo</span> | Rol: <span class="font-mono text-purple-400">${currentUser.role}</span></p>
            </div>
          </div>
        `;
      }

      // 5. RESOURCE VAULT (/dashboard/vault)
      else if (path === '/dashboard/vault') {
        if (!currentUser) return navigate('/login');
        const res = await fetch('/api/resources/vault', { headers: { 'Authorization': `Bearer ${token}` } });
        const items = await res.json();
        app.innerHTML = `
          <div class="space-y-6">
            <div class="glass-card p-6 rounded-2xl">
              <h2 class="text-xl font-bold text-purple-300">Resource Vault (.jar / builds)</h2>
              <p class="text-xs text-zinc-400">Descarga directa de recursos de Synthetix Studio.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${items.map(i => `
                <div class="glass-card p-4 rounded-xl space-y-2 border border-purple-900/30">
                  <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-950 text-purple-400 border border-purple-800/40">${i.category}</span>
                  <h3 class="font-bold text-slate-200">${i.name}</h3>
                  <p class="text-xs text-zinc-400">Versión: ${i.version}</p>
                  <button class="w-full py-2 bg-purple-950 border border-purple-700/50 rounded-lg text-xs font-semibold text-purple-200">Descargar ${i.format}</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 6. TICKET DE SOPORTE (/dashboard/tickets)
      else if (path === '/dashboard/tickets') {
        if (!currentUser) return navigate('/login');
        const res = await fetch('/api/tickets', { headers: { 'Authorization': `Bearer ${token}` } });
        const tickets = await res.json();
        app.innerHTML = `
          <div class="space-y-6">
            <div class="glass-card p-6 rounded-2xl flex justify-between items-center">
              <div>
                <h2 class="text-xl font-bold text-purple-300">Soporte Técnico</h2>
                <p class="text-xs text-zinc-400">Abre un ticket para consultar sobre configuraciones o desarrollo.</p>
              </div>
            </div>

            <!-- Formulario de Nuevo Ticket -->
            <div class="glass-card p-6 rounded-2xl space-y-4">
              <h3 class="text-sm font-bold text-purple-400">Crear Ticket</h3>
              <form onsubmit="handleCreateTicket(event)" class="space-y-3">
                <input type="text" id="tSubject" placeholder="Asunto" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-2.5 text-xs focus:border-[#b026ff] outline-none">
                <select id="tPriority" class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-2.5 text-xs focus:border-[#b026ff] outline-none">
                  <option value="low">Prioridad Baja</option>
                  <option value="medium" selected>Prioridad Media</option>
                  <option value="high">Prioridad Alta</option>
                  <option value="urgent">Urgente</option>
                </select>
                <textarea id="tMessage" placeholder="Detalla tu consulta..." rows="3" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-2.5 text-xs focus:border-[#b026ff] outline-none"></textarea>
                <button type="submit" class="px-4 py-2 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white text-xs font-bold rounded-xl">Enviar Ticket</button>
              </form>
            </div>

            <!-- Lista de Tickets -->
            <div class="space-y-3">
              ${tickets.map(t => `
                <div class="glass-card p-4 rounded-xl space-y-2">
                  <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-purple-300">${t.subject}</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-950 text-purple-400">${t.status}</span>
                  </div>
                  <p class="text-xs text-zinc-400">${t.messages ? t.messages[0].message : ''}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // 7. TÉRMINOS Y CONDICIONES (/dashboard/terms)
      else if (path === '/dashboard/terms') {
        app.innerHTML = `
          <div class="glass-card p-8 rounded-2xl space-y-6 border border-purple-900/40">
            <h2 class="text-2xl font-black text-purple-300 border-b border-purple-900/40 pb-4">Términos de Servicio & Licencias</h2>
            <div class="space-y-4 text-xs text-zinc-300 leading-relaxed">
              <p><strong>1. Licencias de Recursos:</strong> Los plugins y archivos descargados desde el Resource Vault son de uso exclusivo para el comprador o usuario autorizado.</p>
              <p><strong>2. Propiedad Intelectual:</strong> Queda estrictamente prohibida la redistribución, reventa o descompilación no autorizada del código de Synthetix Studio.</p>
              <p><strong>3. Soporte:</strong> La atención de soporte mediante tickets se priorizará en función del rol de usuario (VIP/Client/Dev).</p>
            </div>
          </div>
        `;
      }

      // 8. CONFIGURACIÓN Y PERFIL (/dashboard/settings)
      else if (path === '/dashboard/settings') {
        if (!currentUser) return navigate('/login');
        app.innerHTML = `
          <div class="glass-card p-6 rounded-2xl space-y-6 border border-purple-900/40">
            <h2 class="text-xl font-bold text-purple-300 border-b border-purple-900/40 pb-3">Configuración de Perfil</h2>
            <div class="space-y-3 text-xs">
              <p><span class="text-zinc-500">ID de Usuario:</span> <span class="font-mono text-purple-300">${currentUser.id}</span></p>
              <p><span class="text-zinc-500">Nombre de Usuario:</span> <span>${currentUser.username}</span></p>
              <p><span class="text-zinc-500">Correo Electrónico:</span> <span>${currentUser.email}</span></p>
              <p><span class="text-zinc-500">Rol Asignado:</span> <span class="font-mono text-purple-400 uppercase">${currentUser.role}</span></p>
            </div>
          </div>
        `;
      }

      // 9. METRICAS ADMIN (/admin)
      else if (path === '/admin') {
        if (!currentUser || !['founder', 'staff'].includes(currentUser.role)) return navigate('/login');
        const res = await fetch('/api/admin/metrics', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        app.innerHTML = `
          <div class="space-y-6">
            <div class="glass-card p-6 rounded-2xl border border-purple-900/60 glow-purple">
              <h2 class="text-2xl font-black text-purple-300">Panel de Administración</h2>
              <p class="text-xs text-zinc-400">Consola Central de Infraestructura Edge</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="glass-card p-4 rounded-xl">
                <span class="text-xs text-zinc-500">Usuarios Totales</span>
                <p class="text-2xl font-bold text-purple-400">${data.totalUsers}</p>
              </div>
              <div class="glass-card p-4 rounded-xl">
                <span class="text-xs text-zinc-500">Tickets de Soporte</span>
                <p class="text-2xl font-bold text-purple-400">${data.totalTickets}</p>
              </div>
              <div class="glass-card p-4 rounded-xl">
                <span class="text-xs text-zinc-500">Estado</span>
                <p class="text-2xl font-bold text-emerald-400">Optimal</p>
              </div>
            </div>
          </div>
        `;
      }

      // 10. GESTOR DE USUARIOS (/admin/users)
      else if (path === '/admin/users') {
        if (!currentUser || !['founder', 'staff'].includes(currentUser.role)) return navigate('/login');
        const res = await fetch('/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } });
        const users = await res.json();
        app.innerHTML = `
          <div class="space-y-6">
            <div class="glass-card p-6 rounded-2xl">
              <h2 class="text-xl font-bold text-purple-300">Gestor de Usuarios</h2>
              <p class="text-xs text-zinc-400">Cambio de roles y baneo instantáneo en Cloudflare KV.</p>
            </div>
            <div class="glass-card rounded-2xl overflow-x-auto">
              <table class="w-full text-left text-xs text-zinc-300">
                <thead class="bg-zinc-900 text-purple-400 border-b border-purple-900/50">
                  <tr>
                    <th class="p-3">Usuario</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Rol</th>
                    <th class="p-3">Estado</th>
                    <th class="p-3">Acciones</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-zinc-900">
                  ${users.map(u => `
                    <tr>
                      <td class="p-3 font-medium">${u.username}</td>
                      <td class="p-3 font-mono text-zinc-400">${u.email}</td>
                      <td class="p-3 font-mono text-purple-400">${u.role}</td>
                      <td class="p-3">${u.isBanned ? '<span class="text-red-400 font-bold">Baneado</span>' : '<span class="text-emerald-400">Activo</span>'}</td>
                      <td class="p-3 flex gap-2">
                        ${!u.isBanned ? `<button onclick="banUser('${u.id}')" class="px-2.5 py-1 bg-red-950 border border-red-800 text-red-300 rounded text-[10px]">Banear</button>` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('user').value;
      const password = document.getElementById('pass').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('token', token);
        currentUser = data.user;
        navigate(currentUser.role === 'admin' || currentUser.role === 'founder' ? '/admin' : '/dashboard');
      } else { alert(data.error); }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUser').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPass').value;
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('token', token);
        navigate('/dashboard');
      } else { alert(data.error); }
    }

    async function handleCreateTicket(e) {
      e.preventDefault();
      const subject = document.getElementById('tSubject').value;
      const priority = document.getElementById('tPriority').value;
      const message = document.getElementById('tMessage').value;
      const res = await fetch('/api/tickets', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject, priority, message })
      });
      if (res.ok) {
        navigate('/dashboard/tickets');
      } else { alert('Error creando ticket'); }
    }

    async function banUser(userId) {
      if (!confirm('¿Seguro que deseas banear este usuario?')) return;
      const res = await fetch(`/api/admin/ban/${userId}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) render();
    }

    render();
  </script>
</body>
</html>
