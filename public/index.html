<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthetix Studio | Edge Gaming Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glow-neon { box-shadow: 0 0 25px rgba(176, 38, 255, 0.3); }
    .text-neon { text-shadow: 0 0 14px rgba(176, 38, 255, 0.8); }
    .glass-card { background: rgba(12, 12, 16, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(147, 51, 234, 0.3); }
  </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-100 min-h-screen font-sans flex flex-col selection:bg-[#b026ff] selection:text-white">

  <!-- Header Mobile-First -->
  <header class="sticky top-0 z-50 glass-card px-4 sm:px-8 py-3.5 flex justify-between items-center border-b border-purple-900/40">
    <div onclick="navigate('/')" class="cursor-pointer flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-700 via-[#b026ff] to-indigo-500 flex items-center justify-center font-extrabold text-white shadow-[0_0_15px_rgba(176,38,255,0.5)]">
        S
      </div>
      <span class="text-lg font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-[#b026ff] to-indigo-300 text-neon">
        SYNTHETIX STUDIO
      </span>
    </div>
    <div id="navActions" class="flex gap-2"></div>
  </header>

  <!-- Contenedor Dinámico SPA -->
  <main id="app" class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center"></main>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = null;

    function navigate(path) {
      window.history.pushState({}, '', path);
      render();
    }
    window.onpopstate = render;

    async function fetchUser() {
      if (!token) return currentUser = null;
      try {
        const res = await fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
        } else {
          localStorage.removeItem('token');
          token = null;
          currentUser = null;
        }
      } catch { currentUser = null; }
    }

    function updateHeader() {
      const actions = document.getElementById('navActions');
      if (currentUser) {
        actions.innerHTML = `
          <button onclick="navigate('/dashboard')" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-purple-950/70 border border-purple-700/50 text-purple-300">Vault</button>
          ${['founder', 'staff'].includes(currentUser.role) ? `<button onclick="navigate('/admin')" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-[#b026ff]/20 border border-[#b026ff] text-purple-200">Admin</button>` : ''}
          <button onclick="logout()" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-zinc-900 text-zinc-400">Salir</button>
        `;
      } else {
        actions.innerHTML = `
          <button onclick="navigate('/login')" class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-purple-950 text-purple-300 border border-purple-800/40">Entrar</button>
          <button onclick="navigate('/register')" class="px-3.5 py-1.5 text-xs font-semibold rounded-xl bg-gradient-to-r from-purple-700 to-[#b026ff] text-white shadow-[0_0_12px_rgba(176,38,255,0.4)]">Registro</button>
        `;
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      currentUser = null;
      updateHeader();
      navigate('/');
    }

    async function render() {
      await fetchUser();
      updateHeader();
      const path = window.location.pathname;
      const app = document.getElementById('app');

      if (path === '/') {
        app.innerHTML = `
          <div class="text-center space-y-6 py-12">
            <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-[#b026ff] to-indigo-400 text-neon">
              Cloud Gaming Infrastructure & Plugins
            </h1>
            <p class="text-sm sm:text-base text-zinc-400 max-w-xl mx-auto">
              Plataforma de despliegue de arquitectura para servidores Minecraft, bots de Discord y desarrollo a medida sobre Cloudflare Workers.
            </p>
            <div class="flex justify-center gap-4 pt-4">
              <button onclick="navigate('/register')" class="px-6 py-3 bg-gradient-to-r from-purple-700 via-[#b026ff] to-purple-600 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(176,38,255,0.5)]">Empezar Ahora</button>
            </div>
          </div>
        `;
      } else if (path === '/login') {
        app.innerHTML = `
          <div class="max-w-md w-full mx-auto glass-card p-6 sm:p-8 rounded-2xl glow-neon space-y-4">
            <h2 class="text-xl font-bold text-center text-purple-300">Iniciar Sesión</h2>
            <form onsubmit="handleLogin(event)" class="space-y-3">
              <input type="text" id="user" placeholder="Usuario o Email" required class="w-full bg-zinc-900/90 border border-purple-900/50 rounded-xl p-3 text-xs focus:outline-none focus:border-[#b026ff]">
              <input type="password" id="pass" placeholder="Contraseña" required class="w-full bg-zinc-900/90 border border-purple-900/50 rounded-xl p-3 text-xs focus:outline-none focus:border-[#b026ff]">
              <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white font-bold text-xs rounded-xl shadow-[0_0_15px_rgba(176,38,255,0.4)]">Acceder</button>
            </form>
          </div>
        `;
      } else if (path === '/dashboard') {
        if (!currentUser) return navigate('/login');
        const res = await fetch('/api/resources/vault', { headers: { 'Authorization': `Bearer ${token}` } });
        const items = await res.json();
        app.innerHTML = `
          <div class="space-y-6">
            <div class="glass-card p-6 rounded-2xl border border-purple-900/40">
              <h2 class="text-2xl font-black text-purple-300">Resource Vault</h2>
              <p class="text-xs text-zinc-400 mt-1">Hola ${currentUser.username}, tus binarios y descargas asignadas.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${items.map(i => `
                <div class="glass-card p-4 rounded-xl space-y-2 border border-purple-900/30">
                  <div class="flex justify-between items-center">
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-purple-950 text-purple-400 border border-purple-800/40">${i.category}</span>
                    <span class="text-xs font-bold text-indigo-400">${i.version}</span>
                  </div>
                  <h3 class="font-bold text-slate-200">${i.name}</h3>
                  <button class="w-full py-2 bg-purple-900/40 hover:bg-purple-900/70 border border-purple-700/50 rounded-lg text-xs font-semibold text-purple-200">Descargar ${i.format}</button>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('user').value;
      const password = document.getElementById('pass').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('token', token);
        navigate('/dashboard');
      } else { alert(data.error); }
    }

    render();
  </script>
</body>
</html>
