<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthetix Studio | Custom Development & Architecture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(176, 38, 255, 0.3), inset 0 0 15px rgba(147, 51, 234, 0.2); }
      50% { box-shadow: 0 0 40px rgba(176, 38, 255, 0.6), inset 0 0 25px rgba(147, 51, 234, 0.4); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .neon-card { animation: pulse-glow 6s infinite ease-in-out; }
    .float-anim { animation: float 4s ease-in-out infinite; }
    .text-neon { text-shadow: 0 0 15px rgba(176, 38, 255, 0.8); }
    .glass-panel { background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-100 min-h-screen font-sans flex flex-col selection:bg-[#b026ff] selection:text-white">

  <!-- Navegación Dinámica -->
  <nav class="sticky top-0 z-50 glass-panel border-b border-purple-900/40 px-6 py-4 flex justify-between items-center">
    <div onclick="navigate('/')" class="cursor-pointer flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-700 via-[#b026ff] to-indigo-500 flex items-center justify-center font-bold text-white shadow-[0_0_15px_rgba(176,38,255,0.5)]">
        S
      </div>
      <span class="text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-purple-400 via-[#b026ff] to-purple-200 text-neon">
        SYNTHETIX STUDIO
      </span>
    </div>

    <div id="navLinks" class="flex items-center gap-4 text-sm font-medium">
      <!-- Se inyecta dinámicamente según sesión -->
    </div>
  </nav>

  <!-- Contenedor de Vistas -->
  <main id="app" class="flex-1 max-w-6xl w-full mx-auto p-6 flex flex-col justify-center">
    <!-- El cliente renderiza la vista aquí sin recargar la página -->
  </main>

  <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-500">
    &copy; 2026 Synthetix Studio. Todos los derechos reservados.
  </footer>

  <script>
    let currentUser = null;

    // Sistema de Enrutamiento Limpio Client-Side (SPA)
    function navigate(path) {
      window.history.pushState({}, '', path);
      renderRoute();
    }

    window.onpopstate = renderRoute;

    async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          currentUser = data.user;
        } else {
          currentUser = null;
        }
      } catch { currentUser = null; }
      updateNav();
    }

    function updateNav() {
      const nav = document.getElementById('navLinks');
      if (currentUser) {
        nav.innerHTML = `
          <button onclick="navigate('/dashboard')" class="hover:text-purple-300 transition">Dashboard</button>
          ${currentUser.role === 'admin' ? `<button onclick="navigate('/admin')" class="px-3 py-1 rounded-lg bg-purple-950 text-purple-300 border border-purple-700/50 hover:bg-purple-900 transition">Admin Panel</button>` : ''}
          <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-zinc-300 transition">Cerrar Sesión</button>
        `;
      } else {
        nav.innerHTML = `
          <button onclick="navigate('/login')" class="hover:text-purple-300 transition">Iniciar Sesión</button>
          <button onclick="navigate('/register')" class="px-4 py-1.5 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white rounded-xl font-semibold shadow-[0_0_15px_rgba(176,38,255,0.4)] hover:opacity-90 transition">Registrarse</button>
        `;
      }
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      currentUser = null;
      updateNav();
      navigate('/');
    }

    async function renderRoute() {
      const path = window.location.pathname;
      const app = document.getElementById('app');

      if (path === '/') {
        const res = await fetch('/api/services');
        const services = await res.json();
        app.innerHTML = `
          <div class="space-y-12 py-8">
            <div class="text-center space-y-4 max-w-2xl mx-auto float-anim">
              <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-[#b026ff] to-indigo-300 text-neon">
                Soluciones Edge & Game Infrastructure
              </h1>
              <p class="text-zinc-400 text-base sm:text-lg">
                Desarrollo avanzado de Plugins de Minecraft, Arquitectura Velocity, Bots y Servidores de Discord de alto rendimiento.
              </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${services.map(s => `
                <div class="glass-panel border border-purple-900/40 p-6 rounded-2xl neon-card hover:border-[#b026ff]/80 transition duration-300 group">
                  <div class="text-3xl mb-3 group-hover:scale-110 transition duration-300">${s.icon}</div>
                  <span class="text-[10px] font-mono tracking-widest uppercase px-2 py-0.5 rounded bg-purple-950 text-purple-400 border border-purple-800/40">${s.category}</span>
                  <h3 class="text-xl font-bold text-slate-100 mt-2 mb-1">${s.title}</h3>
                  <p class="text-sm text-zinc-400">${s.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (path === '/login') {
        app.innerHTML = `
          <div class="max-w-md w-full mx-auto glass-panel border border-purple-900/50 p-8 rounded-2xl neon-card space-y-6">
            <h2 class="text-2xl font-bold text-center text-purple-300">Iniciar Sesión</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <input type="text" id="username" placeholder="Usuario o Email" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-sm focus:outline-none focus:border-[#b026ff]">
              <input type="password" id="password" placeholder="Contraseña" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-sm focus:outline-none focus:border-[#b026ff]">
              <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white font-bold rounded-xl shadow-[0_0_20px_rgba(176,38,255,0.4)]">Entrar</button>
            </form>
          </div>
        `;
      } else if (path === '/register') {
        app.innerHTML = `
          <div class="max-w-md w-full mx-auto glass-panel border border-purple-900/50 p-8 rounded-2xl neon-card space-y-6">
            <h2 class="text-2xl font-bold text-center text-purple-300">Crear Cuenta</h2>
            <form onsubmit="handleRegister(event)" class="space-y-4">
              <input type="text" id="regUser" placeholder="Nombre de Usuario" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-sm focus:outline-none focus:border-[#b026ff]">
              <input type="email" id="regEmail" placeholder="Correo Electrónico" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-sm focus:outline-none focus:border-[#b026ff]">
              <input type="password" id="regPass" placeholder="Contraseña" required class="w-full bg-zinc-900 border border-purple-900/50 rounded-xl p-3 text-sm focus:outline-none focus:border-[#b026ff]">
              <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-700 to-[#b026ff] text-white font-bold rounded-xl shadow-[0_0_20px_rgba(176,38,255,0.4)]">Registrarse</button>
            </form>
          </div>
        `;
      } else if (path === '/dashboard') {
        if (!currentUser) return navigate('/login');
        app.innerHTML = `
          <div class="glass-panel border border-purple-900/40 p-8 rounded-2xl space-y-6">
            <h2 class="text-3xl font-extrabold text-purple-300">Bienvenido, ${currentUser.username}</h2>
            <p class="text-zinc-400">Panel de control de servicios activos y solicitudes.</p>
            <div class="p-4 bg-zinc-900/90 rounded-xl border border-purple-900/30">
              <p class="text-xs text-purple-400 font-mono">Rol de Usuario: ${currentUser.role}</p>
            </div>
          </div>
        `;
      } else if (path === '/admin') {
        if (!currentUser || currentUser.role !== 'admin') return navigate('/login');
        const res = await fetch('/api/admin/metrics');
        if (!res.ok) return navigate('/dashboard');
        const data = await res.json();
        app.innerHTML = `
          <div class="glass-panel border border-purple-900/60 p-8 rounded-2xl space-y-6">
            <h2 class="text-3xl font-extrabold text-purple-300">Panel de Administración (/admin)</h2>
            <div class="grid grid-cols-3 gap-4">
              <div class="bg-zinc-900 p-4 rounded-xl border border-purple-900/50">
                <span class="text-xs text-zinc-500">Usuarios Registrados</span>
                <p class="text-2xl font-bold text-purple-400">${data.totalUsers}</p>
              </div>
              <div class="bg-zinc-900 p-4 rounded-xl border border-purple-900/50">
                <span class="text-xs text-zinc-500">Servicios Activos</span>
                <p class="text-2xl font-bold text-purple-400">${data.activeServices}</p>
              </div>
              <div class="bg-zinc-900 p-4 rounded-xl border border-purple-900/50">
                <span class="text-xs text-zinc-500">Estado del Sistema</span>
                <p class="text-2xl font-bold text-emerald-400">${data.systemStatus}</p>
              </div>
            </div>
          </div>
        `;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data.user;
        updateNav();
        navigate(currentUser.role === 'admin' ? '/admin' : '/dashboard');
      } else { alert(data.error); }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUser').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPass').value;
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data.user;
        updateNav();
        navigate('/dashboard');
      } else { alert(data.error); }
    }

    checkAuth().then(renderRoute);
  </script>
</body>
</html>
